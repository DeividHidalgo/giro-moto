<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Giro Moto">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>[hidden]{display:none!important}html,body{margin:0}</style>
<title>Giro Moto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de coluna única para celular, abas fixas embaixo; a placa estilo Mercosul é o elemento visual da frota */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F4F6F8; --ink:#121C26; --ink-2:#4B5966; --line:#D6DCE2;
  --accent:#0F4FA8; --accent-ink:#FFFFFF; --accent-soft:#E1EAF7;
  --ok:#1C7C47; --ok-soft:#DCF1E4; --warn:#855400; --warn-soft:#FBEBC8; --bad:#B3261E; --bad-soft:#FADBD8;
  --plate-band:#0B3C8C;
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1218; --surface:#151E28; --surface-2:#1B2631; --ink:#E8EDF2; --ink-2:#9AA8B6; --line:#2A3744;
    --accent:#6FA8FF; --accent-ink:#0B1520; --accent-soft:#1B2D45;
    --ok:#5FD18F; --ok-soft:#173526; --warn:#F0B84A; --warn-soft:#3A2E12; --bad:#FF8A80; --bad-soft:#40201E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1218; --surface:#151E28; --surface-2:#1B2631; --ink:#E8EDF2; --ink-2:#9AA8B6; --line:#2A3744;
  --accent:#6FA8FF; --accent-ink:#0B1520; --accent-soft:#1B2D45;
  --ok:#5FD18F; --ok-soft:#173526; --warn:#F0B84A; --warn-soft:#3A2E12; --bad:#FF8A80; --bad-soft:#40201E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);padding-inline:16px;padding-block:0 96px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:760px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font:700 28px/1 var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.top p{margin:3px 0 0;font-size:12px;color:var(--ink-2)}
#modo{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);padding:5px 8px;border-radius:999px;text-align:right}
main{padding-block:16px;display:grid;gap:22px}
h2{margin:0;font:600 21px/1.1 var(--font-display);letter-spacing:.05em;text-transform:uppercase}
h2 small{font:600 13px var(--font-body);letter-spacing:0;color:var(--ink-2);margin-left:6px}
.eyebrow{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.pad{padding-block:24px}
section{display:grid;gap:12px;min-width:0}

/* frota */
.bar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.bar i{display:block;min-width:6px}
.s-ok{background:var(--ok)} .s-info{background:var(--accent)} .s-warn{background:var(--warn)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.counts div{display:grid;gap:2px}
.counts b{font:700 44px/1 var(--font-display);font-variant-numeric:tabular-nums}
.counts span{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.counts span:before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.9}
.counts .c-ok span{color:var(--ok)} .counts .c-info span{color:var(--accent)} .counts .c-warn span{color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.kpis div{padding:14px 16px;display:grid;gap:2px}
.kpis div+div{border-left:1px solid var(--line)}
.kpis span{font-size:12px;color:var(--ink-2)}
.kpis b{font:700 28px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
@media (max-width:420px){.kpis div+div{border-left:0;border-top:1px solid var(--line)}}
.aviso{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}

/* listas e cartões */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1 1 180px;min-width:0}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;text-align:left;cursor:pointer;min-width:0}
button.card:hover{border-color:var(--accent)}
.card .tx{min-width:0;display:grid;gap:2px}
.card strong{font-weight:600;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--line);display:inline-block}
.right{display:grid;gap:6px;justify-items:end;text-align:right}
.right small{font-size:12px;color:var(--ink-2)}
@media (max-width:460px){
  .card.moto,.card.cli{grid-template-columns:auto 1fr}
  .card .right{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;text-align:left}
}
.ava{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 17px var(--font-display);letter-spacing:.04em}
.alert{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.alert .pill{flex:none;margin-top:1px}
.alert span.tx{display:grid;gap:1px;min-width:0}
.alert small{color:var(--ink-2);overflow-wrap:anywhere}
.pill{display:inline-block;font:600 11px/1 var(--font-body);letter-spacing:.04em;text-transform:uppercase;padding:5px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;color:var(--ink-2);display:grid;gap:10px;justify-items:center}

/* placa */
.plate{display:inline-flex;flex-direction:column;border:2px solid #222;border-radius:5px;background:#fff;overflow:hidden;min-width:92px;text-align:center}
.plate i{font:600 8px/1 var(--font-body);letter-spacing:.24em;background:var(--plate-band);color:#fff;padding:2px 0 2px .24em;font-style:normal}
.plate b{font:700 24px/1 var(--font-display);letter-spacing:.07em;color:#111;padding:4px 8px 3px}

/* locações */
.loc{display:grid;grid-template-columns:1fr;gap:12px;cursor:default}
.loc-top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.loc-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:0}
.loc-meta dt{font-size:12px;color:var(--ink-2)}
.loc-meta dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.loc-act{display:flex;justify-content:flex-end}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button,.chip{border:0;background:transparent;border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* botões e formulários */
.btn{font:600 15px var(--font-body);padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad)} .btn.danger.sure{background:var(--bad);color:#fff;border-color:transparent}
.btn.sm{padding:8px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.loc-pay{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.loc-act{gap:8px;flex-wrap:wrap}
.pg-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.pg-list li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:14px;font-variant-numeric:tabular-nums}
.pg-list small{color:var(--ink-2);display:block}
.hr{border:0;border-top:1px solid var(--line);margin:2px 0}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:600;font-size:13px;color:var(--ink-2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding-top:4px}
.foot .grow{margin-right:auto}
.ferr{margin:0;color:var(--bad);font-size:14px;font-weight:600}
.nota{margin:0;font-size:13px;color:var(--ink-2)}
.resumo{margin:0;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-weight:600;font-variant-numeric:tabular-nums}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(8,14,20,.58);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:600px){.sheet{align-items:center}.panel{border-radius:16px}}
.panel h3{margin:0;font:600 22px/1.1 var(--font-display);letter-spacing:.05em;text-transform:uppercase}

/* login */
.login{display:grid;justify-items:center;padding-block:clamp(24px,12vh,120px) 24px}
.login-card{width:100%;max-width:380px;display:grid;gap:16px}
.login-card .plate{justify-self:center}
.plate.big{min-width:170px}
.plate.big i{font-size:10px}
.plate.big b{font-size:30px;padding:6px 14px 4px}
.login-card h1{margin:0;font:600 26px/1.1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;text-align:center}
.login-card p{margin:0;color:var(--ink-2);text-align:center;font-size:14px}
.login-card .ferr{text-align:center;min-height:1.2em}
.pw{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.top-r{display:flex;gap:8px;align-items:center}
.login-card .hint{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px}
.acesso{display:grid;gap:10px}
.acesso .row{display:flex;gap:8px;flex-wrap:wrap}
.pg-list.ro li{grid-template-columns:1fr auto}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.fgrid figure{margin:0;position:relative;border-radius:8px;overflow:hidden;background:var(--surface-2);aspect-ratio:1}
.fgrid img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.resumo-c{display:grid;gap:10px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.resumo-c.bad{border-color:var(--bad);background:var(--bad-soft)} .resumo-c.warn{border-color:var(--warn);background:var(--warn-soft)} .resumo-c.ok{background:var(--ok-soft);border-color:transparent}
.resumo-c .big{font-family:var(--font-display);font-size:34px;line-height:1;letter-spacing:.01em;margin:0}
.resumo-c .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0}
.resumo-c p{margin:0} .resumo-c .btn{justify-self:start}
.parc{list-style:none;margin:0;padding:0;display:grid;gap:6px} .parc li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.parc li span small{display:block;color:var(--ink-2);font-size:12px} .parc li b{white-space:nowrap}
.fgrid .pdfbox{display:grid;place-content:center;gap:4px;height:100%;padding:8px;text-align:center;font-size:11px;color:var(--ink-2);word-break:break-all} .fgrid .pdfbox b{font-size:18px;color:var(--bad)} .fgrid .b2{left:4px;right:auto} .fgrid figure.big{grid-column:1/-1;aspect-ratio:auto}
.fgrid figure.big img{height:auto;object-fit:contain;cursor:zoom-out}
.fgrid figure button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;font-weight:700;padding:5px 9px;cursor:pointer}
.fgrid figure button.sure{background:var(--bad)}
.filebtn{display:inline-flex;align-items:center;cursor:pointer;color:var(--ink);font-size:13px;width:fit-content}
.filebtn input{display:none}
.docs{display:grid;gap:8px}
@media (max-width:460px){.loc-top{grid-template-columns:auto 1fr}.loc-top>.pill{grid-column:1/-1;justify-self:start}}
/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{display:grid;justify-items:center;gap:3px;border:0;background:transparent;padding:7px 4px;border-radius:10px;font-size:11px;font-weight:600;color:var(--ink-2);cursor:pointer}
.tabs button[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
#f-wmsg{font-family:var(--font-body);letter-spacing:normal;word-break:normal}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
a.btn.disabled{opacity:.45;pointer-events:none}
label.chk{display:flex;align-items:center;gap:10px;font-weight:500}
label.chk input{width:auto;min-height:0;margin:0}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

</head>
<body>
<div id="login" class="login">
  <form id="lf" class="login-card" novalidate>
    <span class="plate big" aria-hidden="true"><i>BRASIL</i><b>GIRO MOTO</b></span>
    <h1>Entrar</h1>
    <p>Administrador ou cliente</p>
    <label>Usuário<input id="lu" name="u" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Senha<span class="pw"><input id="lp" name="p" type="password" autocomplete="current-password" required><button type="button" class="btn sm" id="lshow">Mostrar</button></span></label>
    <p class="hint" id="lhint" hidden></p>
    <p class="ferr" id="lerr" role="alert"></p>
    <button class="btn primary" id="lgo" type="submit">Entrar</button>
    <button class="btn" id="lsetup" type="button" hidden>Primeiro acesso: criar administrador</button>
  </form>
</div>

<div id="shell" hidden>
<div class="app">
  <header class="top">
    <div><h1>Giro Moto</h1><p id="hsub">Locação de motos · painel do dono</p></div>
    <div class="top-r"><span id="modo" hidden>Demonstração<br>não é salva</span><button class="btn sm" data-act="sair">Sair</button></div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<nav class="tabs" aria-label="Seções">
  <div class="tabs-in">
    <button data-act="tab" data-tab="painel"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/></svg>Painel</button>
    <button data-act="tab" data-tab="motos"><svg viewBox="0 0 24 24"><circle cx="6" cy="16" r="3"/><circle cx="18" cy="16" r="3"/><path d="M6 16l4-7h5l3 7M10 9H7M14 9l-2 7"/></svg>Motos</button>
    <button data-act="tab" data-tab="clientes"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>Clientes</button>
    <button data-act="tab" data-tab="locacoes"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>Locações</button>
  </div>
</nav>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h3 id="sheet-title"></h3>
    <div id="sheet-body"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var GC=window.GIRO_CONFIG||{},SUPABASE_URL=GC.SUPABASE_URL||"",SUPABASE_KEY=GC.SUPABASE_KEY||"",EMAIL_BASE=GC.EMAIL_BASE||"admin@example.com";

(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};

/* ---------- datas e formatos ---------- */
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var today=function(){return iso(new Date())};
var addDays=function(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
var diff=function(a,b){return Math.round((parse(b)-parse(a))/864e5)};
var fmtD=function(s){return s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'—'};
var fmtShort=function(s){return s.slice(8,10)+'/'+s.slice(5,7)};
var brl=function(n){return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};
var num=function(n){return (n||0).toLocaleString('pt-BR')};
var plural=function(n,a,b){return n+' '+(n===1?a:b)};

/* ---------- placa e cor ---------- */
var normPlaca=function(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'')};
var placaOk=function(v){return /^[A-Z]{3}\d{4}$/.test(v)||/^[A-Z]{3}\d[A-Z]\d{2}$/.test(v)};
var fmtPlaca=function(v){v=v||'';return /^[A-Z]{3}\d{4}$/.test(v)?v.slice(0,3)+'-'+v.slice(3):v};
var plate=function(p){var f=esc(fmtPlaca(p)||'———');return '<span class="plate" aria-label="Placa '+f+'"><i>BRASIL</i><b>'+f+'</b></span>'};
var CORES={pret:'#1b1b1b',branc:'#f4f4f4',vermelh:'#c62828',azul:'#1e56b5',cinz:'#8a9099',prat:'#b9bfc6',amarel:'#f2c200',verd:'#2e7d32',laranj:'#ef6c00'};
function corHex(c){var k=String(c||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();for(var p in CORES){if(k.indexOf(p)===0)return CORES[p]}return '#9aa3ad'}
var ST={disponivel:'Disponível',alugada:'Alugada',manutencao:'Manutenção'};

/* Vencimentos semanais: toda segunda (1) ou sexta (5), a partir do primeiro dia de pagamento depois do início */
function vencs(l,ate){
  var out=[],d=l.inicio,dp=+l.diaPag||1,g=0;
  while(parse(d).getDay()!==dp&&g++<7)d=addDays(d,1);
  while(d<=ate&&out.length<520){out.push(d);d=addDays(d,7)}
  return out;
}
function cobradoBase(l){
  var t=today();
  if(!l.valorSemanal){
    if(l.status!=='ativa')return l.valorTotal!=null?l.valorTotal:Math.max(1,diff(l.inicio,l.encerradaEm||l.fim))*(l.valorDiaria||0);
    return Math.max(1,diff(l.inicio,l.fim>t?l.fim:t))*(l.valorDiaria||0);
  }
  if(l.status!=='ativa')return l.valorTotal!=null?l.valorTotal:vencs(l,l.encerradaEm||l.fim).length*l.valorSemanal;
  return vencs(l,t).length*l.valorSemanal;
}
function cobrado(l){return r2(cobradoBase(l)+extras(l))}
function previsto(l){
  if(!l.valorSemanal)return cobrado(l);
  var t=today();return r2(vencs(l,l.fim>t?l.fim:t).length*l.valorSemanal+extras(l));
}
var saldo=function(l){return r2(cobrado(l)-pago(l.id))};
/* atraso: parcelas vencidas antes de hoje que ainda não foram pagas */
function atraso(l){
  if(l.status!=='ativa')return Math.max(0,saldo(l));
  if(!l.valorSemanal)return l.fim<=today()?Math.max(0,saldo(l)):Math.max(0,r2(extras(l,today())-pago(l.id)));
  return Math.max(0,r2(vencs(l,addDays(today(),-1)).length*l.valorSemanal+extras(l,today())-pago(l.id)));
}
/* multa e juros sugeridos: só sobre as parcelas vencidas ainda em aberto (pagamentos quitam as mais antigas primeiro) */
function encargoSugerido(l){
  var out={valor:0,base:0,calc:0,lancado:0};
  if(!l.valorSemanal||l.status!=='ativa')return out;
  var c=cobr(),t=today(),resto=pago(l.id),mul=0,jur=0,base=0;
  vencs(l,addDays(t,-1)).forEach(function(v){
    var cob=Math.min(resto,l.valorSemanal);resto=r2(resto-cob);
    var aberto=r2(l.valorSemanal-cob);
    if(aberto>0){base+=aberto;mul+=aberto*c.multaPct/100;jur+=aberto*(c.jurosMesPct/30/100)*Math.max(0,diff(v,t))}
  });
  out.base=r2(base);out.calc=r2(mul+jur);
  out.lancado=r2(ocorrDe(l.id).filter(function(o){return o.tipo==='encargo'}).reduce(function(s,o){return s+(+o.valor||0)},0));
  out.valor=Math.max(0,r2(out.calc-out.lancado));
  return out;
}
function proxVenc(l){
  if(!l.valorSemanal||l.status!=='ativa')return null;
  var t=today(),v=vencs(l,addDays(t,7));
  for(var i=0;i<v.length;i++){if(v[i]>=t)return v[i]}
  return null;
}

function tlv(id,v){return id+pad(v.length)+v}
function crc16(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}}return c.toString(16).toUpperCase().padStart(4,'0')}
function pixPayload(cfg,valor){
  var ascii=function(s,n){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x20-\x7E]/g,'').toUpperCase().slice(0,n)};
  var gui=tlv('00','br.gov.bcb.pix')+tlv('01',String(cfg.chave).trim());
  var p=tlv('00','01')+tlv('01','11')+tlv('26',gui)+tlv('52','0000')+tlv('53','986')+(valor>0?tlv('54',valor.toFixed(2)):'')+tlv('58','BR')+tlv('59',ascii(cfg.nome,25))+tlv('60',ascii(cfg.cidade,15))+tlv('62',tlv('05','***'))+'6304';
  return p+crc16(p);
}

function mapDoc(d){return Object.assign({id:d.id},d.data())}
function dbStore(db){
  var onErr=function(e){toast('Falha ao ler os dados ('+(e&&e.code||'erro')+').')};
  return {
    sub:function(c,f){return db.collection(c).onSnapshot(function(snap){f(snap.docs.map(function(d){return mapDoc(d)}))},onErr)},
    subWhere:function(c,fl,v,f){return db.collection(c).where(fl,'==',v).onSnapshot(function(snap){f(snap.docs.map(function(d){return mapDoc(d)}))},onErr)},
    subDoc:function(c,id,f){return db.collection(c).doc(id).onSnapshot(function(d){f(d.exists?mapDoc(d):null)},onErr)},
    query:function(c,fl,v){return db.collection(c).where(fl,'==',v).get().then(function(snap){return snap.docs.map(function(d){return mapDoc(d)})})},
    getDoc:function(c,id){return db.collection(c).doc(id).get().then(function(d){return d.exists?mapDoc(d):null})},
    list:function(c){return db.collection(c).get().then(function(snap){return snap.docs.map(function(d){return mapDoc(d)})})},
    set:function(c,id,v){return db.collection(c).doc(id).set(v)},
    update:function(c,id,v){return db.collection(c).doc(id).update(v)},
    del:function(c,id){return db.collection(c).doc(id).delete()}
  };
}

if(SUPABASE_URL&&window.supabase){SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'giromoto-auth'}})}
function supaStore(sb){
  var T='docs',PAGE=1000,watchers={};
  var onErr=function(e){toast('Falha ao ler os dados. Verifique a conexão.')};
  var ck=function(r){if(r&&r.error)throw r.error;return r.data};
  var toDocs=function(rows){return (rows||[]).map(function(r){return Object.assign({id:r.id},r.data)})};
  function fetchAll(c,fl,v){
    var out=[];
    function page(from){
      var q=sb.from(T).select('id,data').eq('col',c);
      if(fl)q=q.eq('data->>'+fl,v);
      return q.order('id').range(from,from+PAGE-1).then(function(r){
        var rows=ck(r);out=out.concat(rows);
        return rows.length===PAGE?page(from+PAGE):out;
      });
    }
    return page(0).then(toDocs);
  }
  function fetchOne(c,id){return sb.from(T).select('id,data').eq('col',c).eq('id',id).maybeSingle().then(function(r){var d=ck(r);return d?Object.assign({id:d.id},d.data):null})}
  function bump(c){(watchers[c]||[]).slice().forEach(function(run){run()})}
  function watch(c,load,f){
    var alive=true,t=0,run=function(){if(!alive)return;load().then(function(x){if(alive)f(x)}).catch(onErr)};
    var deb=function(){clearTimeout(t);t=setTimeout(run,120)};
    (watchers[c]||(watchers[c]=[])).push(deb);
    run();
    var ch=null;
    try{ch=sb.channel('r-'+c+'-'+Math.random().toString(36).slice(2,8)).on('postgres_changes',{event:'*',schema:'public',table:T,filter:'col=eq.'+c},deb).subscribe()}catch(e){ch=null}
    var poll=setInterval(run,30000);
    return function(){alive=false;clearTimeout(t);clearInterval(poll);watchers[c]=(watchers[c]||[]).filter(function(x){return x!==deb});if(ch)try{sb.removeChannel(ch)}catch(e){}};
  }
  return {
    sub:function(c,f){return watch(c,function(){return fetchAll(c)},f)},
    subWhere:function(c,fl,v,f){return watch(c,function(){return fetchAll(c,fl,v)},f)},
    subDoc:function(c,id,f){return watch(c,function(){return fetchOne(c,id)},f)},
    query:function(c,fl,v){return fetchAll(c,fl,v)},
    getDoc:function(c,id){return fetchOne(c,id)},
    list:function(c){return fetchAll(c)},
    set:function(c,id,v){return sb.from(T).upsert({col:c,id:id,data:v},{onConflict:'col,id'}).then(function(r){ck(r);bump(c)})},
    update:function(c,id,v){return fetchOne(c,id).then(function(d){
      if(!d)throw new Error('registro não encontrado');
      var m=Object.assign({},d);delete m.id;
      return sb.from(T).upsert({col:c,id:id,data:Object.assign(m,v)},{onConflict:'col,id'}).then(function(r){ck(r);bump(c)});
    })},
    del:function(c,id){return sb.from(T).delete().eq('col',c).eq('id',id).then(function(r){ck(r);bump(c)})}
  };
}
function memStore(){
  var data={},subs={};
  var D=function(c){return data[c]||(data[c]=new Map())},B=function(c){return subs[c]||(subs[c]=[])};
  var list=function(c){var l=[];D(c).forEach(function(v,k){l.push(Object.assign({id:k},v))});return l};
  var one=function(c,id){var v=D(c).get(id);return v?Object.assign({id:id},v):null};
  var emit=function(c){B(c).slice().forEach(function(run){run()})};
  var add=function(c,run){B(c).push(run);run();return function(){subs[c]=B(c).filter(function(x){return x!==run})}};
  return {
    sub:function(c,f){return add(c,function(){f(list(c))})},
    subWhere:function(c,fl,v,f){return add(c,function(){f(list(c).filter(function(x){return x[fl]===v}))})},
    subDoc:function(c,id,f){return add(c,function(){f(one(c,id))})},
    query:function(c,fl,v){return Promise.resolve(list(c).filter(function(x){return x[fl]===v}))},
    getDoc:function(c,id){return Promise.resolve(one(c,id))},
    list:function(c){return Promise.resolve(list(c))},
    set:function(c,id,v){D(c).set(id,v);emit(c);return Promise.resolve()},
    update:function(c,id,v){D(c).set(id,Object.assign({},D(c).get(id),v));emit(c);return Promise.resolve()},
    del:function(c,id){D(c).delete(id);emit(c);return Promise.resolve()}
  };
}

/* ---------- cadastro do cliente: documentos, endereço (CEP) e anexos ---------- */
var anexosPath=function(cid){return 'clientes/'+cid+'/anexos'};
var soDig=function(v){return String(v==null?'':v).replace(/\D/g,'')};
function fmtCpf(v){var d=soDig(v).slice(0,11);return d.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1-$2')}
function fmtCep(v){var d=soDig(v).slice(0,8);return d.length>5?d.slice(0,5)+'-'+d.slice(5):d}
function cpfOk(v){
  var d=soDig(v);if(d.length!==11||/^(\d)\1{10}$/.test(d))return false;
  for(var t=9;t<11;t++){var sum=0;for(var k=0;k<t;k++)sum+=+d[k]*(t+1-k);var dv=(sum*10)%11%10;if(dv!==+d[t])return false}
  return true;
}
function endTexto(c){
  if(!c)return '';
  var a=[];
  if(c.endereco)a.push(c.endereco+(c.numero?', '+c.numero:'')+(c.complemento?' ('+c.complemento+')':''));
  if(c.bairro)a.push(c.bairro);
  if(c.cidade)a.push(c.cidade+(c.uf?'/'+c.uf:''));
  if(c.cep)a.push('CEP '+fmtCep(c.cep));
  return a.join(' - ');
}
/* documento anexado: foto (reduzida) ou PDF de até 600 KB */
function resizeDoc(file){
  if(file.type==='application/pdf'){
    return new Promise(function(res,rej){
      if(file.size>600*1024)return rej(new Error('pdf grande'));
      var fr=new FileReader();fr.onerror=function(){rej(new Error('leitura'))};fr.onload=function(){res({dataUrl:fr.result,tipo:'pdf'})};fr.readAsDataURL(file);
    });
  }
  return new Promise(function(res,rej){
    var fr=new FileReader();fr.onerror=function(){rej(new Error('leitura'))};
    fr.onload=function(){
      var img=new Image();img.onerror=function(){rej(new Error('imagem'))};
      img.onload=function(){
        var lados=[1600,1280,1000],qs=[0.7,0.55,0.45],out=null;
        for(var i=0;i<lados.length&&!out;i++){
          var k=Math.min(1,lados[i]/Math.max(img.width,img.height)),cv=document.createElement('canvas');
          cv.width=Math.max(1,Math.round(img.width*k));cv.height=Math.max(1,Math.round(img.height*k));
          cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
          for(var j=0;j<qs.length;j++){var d=cv.toDataURL('image/jpeg',qs[j]);if(d.length<=260000){out=d;break}}
        }
        out?res({dataUrl:out,tipo:'img'}):rej(new Error('grande'));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function baixarAnexo(a){
  try{
    var p=String(a.dataUrl).split(','),mime=(p[0].match(/:(.*?);/)||[])[1]||'application/octet-stream',bin=atob(p[1]),u=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([u],{type:mime})),x=document.createElement('a');
    x.href=url;x.download=a.nome||'documento';x.target='_blank';x.rel='noopener';document.body.appendChild(x);x.click();x.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},30000);
  }catch(e){toast('Não foi possível abrir o arquivo.')}
}

  if(typeof fetch!=='function')return Promise.reject(new Error('sem rede'));

function waNum(tel){
  var d=String(tel||'').replace(/\D/g,'');

  return (d.length>=12&&d.length<=13&&d.indexOf('55')===0)?d:'';

function waModelo(l){
  var at=atraso(l),px=proxVenc(l),sd=saldo(l);
  if(at>0)return 'atraso';

}
function waTexto(l,modelo,comPix){
  var c=cliente(l.clienteId)||{nome:''},m=moto(l.motoId)||{modelo:'moto',placa:''};
  var nome=String(c.nome||'').split(/\s+/)[0]||'tudo bem',moto_=m.modelo+(m.placa?' ('+fmtPlaca(m.placa)+')':'');
  var at=atraso(l),sd=saldo(l),px=proxVenc(l),valor,corpo;
  if(modelo==='atraso'){
    valor=at>0?at:Math.max(0,sd);
    corpo='Olá, '+nome+'! Tudo bem? Aqui é da Giro Moto. Consta em aberto '+brl(valor)+' da locação da '+moto_+'.';
  }else if(modelo==='lembrete'){
    valor=sd>0?sd:(l.valorSemanal||0);
    corpo='Olá, '+nome+'! Tudo bem? Aqui é da Giro Moto. Lembrete: a cobrança semanal de '+brl(valor)+' da '+moto_+' vence '+(px?wd(px)+' '+fmtShort(px):'esta semana')+'.';
  }else{
    valor=0;
    corpo='Olá, '+nome+'! Tudo bem? Aqui é da Giro Moto. Lembrando que a devolução da '+moto_+' está prevista para '+fmtD(l.fim)+'.';
  }
  var pix='';
  if(comPix&&valor>0&&S.pix){try{pix=pixPayload(S.pix,valor)}catch(e){pix=''}}

var PIXT={celular:'Celular',doc:'CPF ou CNPJ',email:'E-mail',aleatoria:'Chave aleatória'};
function pixTipoDe(ch){
  ch=String(ch||'').trim();
  if(ch.charAt(0)==='+')return 'celular';
  if(ch.indexOf('@')>-1)return 'email';
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(ch))return 'aleatoria';
  var d=ch.replace(/\D/g,'');
  if(d.length===14||(d.length===11&&/^[\d.\-\s]+$/.test(ch)&&/[.\-]/.test(ch)))return 'doc';
  return 'celular';
}
/* devolve a chave no formato que o Pix exige, ou {erro} */
function pixChave(tipo,raw){
  var v=String(raw||'').trim(),d=v.replace(/\D/g,'');
  if(tipo==='celular'){
    if(d.length>=12&&d.length<=13&&d.indexOf('55')===0)return {chave:'+'+d};
    if(d.length===10||d.length===11)return {chave:'+55'+d};
    return {erro:'Celular inválido. Informe o DDD e o número, por exemplo (15) 99999-0000.'};
  }
  if(tipo==='doc'){
    if(d.length===11||d.length===14)return {chave:d};
    return {erro:'CPF deve ter 11 números e CNPJ, 14.'};
  }
  if(tipo==='email'){
    v=v.toLowerCase();
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)?{chave:v}:{erro:'E-mail inválido.'};
  }
  v=v.toLowerCase();
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(v)?{chave:v}:{erro:'Chave aleatória inválida. Ela tem o formato xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx.'};
}
function formPix(){
  var d=S.pix||{},tipo=d.tipo||(d.chave?pixTipoDe(d.chave):'celular');
  openSheet({

    onSubmit:function(fd){

      if(!raw||!nome||!cidade)return 'Preencha a chave, o nome e a cidade.';
      var t=fd.tipo||pixTipoDe(raw),r=pixChave(t,raw);

var TIPOS={oleo:'Troca de óleo',revisao:'Revisão',pneu:'Pneu',freio:'Freio',corrente:'Corrente e relação',outro:'Outro'};
function ultimoKm(m,tipo,campo){
  var ks=S.manutencoes.filter(function(r){return r.motoId===m.id&&r.tipo===tipo&&r.km!=null}).map(function(r){return +r.km});
  if(m[campo]!=null&&m[campo]!=='')ks.push(+m[campo]);
  return ks.length?Math.max.apply(null,ks):null;
}
function manutInfo(m){
  var out=[],t=today(),km=m.km||0;
  [['ipvaVenc','IPVA'],['licVenc','Licenciamento'],['seguroVenc','Seguro']].forEach(function(x){
    var v=m[x[0]];if(!v)return;var d=diff(t,v);
    if(d<0)out.push({lv:'bad',k:'doc',t:x[1]+' vencido há '+plural(-d,'dia','dias')});
    else if(d<=30)out.push({lv:'warn',k:'doc',t:x[1]+' vence em '+plural(d,'dia','dias')+' ('+fmtD(v)+')'});
  });
  [['oleo','Troca de óleo','oleoInt','oleoUlt',300],['revisao','Revisão','revInt','revUlt',500]].forEach(function(x){
    var inte=+m[x[2]]||0;if(!inte)return;
    var last=ultimoKm(m,x[0],x[3]);if(last==null)return;
    var rest=inte-(km-last);
    if(rest<=0)out.push({lv:'bad',k:'man',t:x[1]+' vencida há '+num(-rest)+' km'});
    else if(rest<=x[4])out.push({lv:'warn',k:'man',t:x[1]+' em '+num(rest)+' km'});
  });
  return out;
}
function manutLinha(m){
  var i=manutInfo(m);if(!i.length)return '';
  var bad=i.some(function(x){return x.lv==='bad'});
  return '<span class="sub"><span class="pill '+(bad?'bad':'warn')+'">Atenção</span> '+esc(i[0].t)+(i.length>1?' +'+(i.length-1):'')+'</span>';

/* reduz a foto para caber no banco: lado maior de até 900 px, JPEG, no máximo ~110 mil caracteres */
function resizeFoto(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('leitura'))};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){rej(new Error('imagem'))};
      img.onload=function(){
        var lados=[900,720,560],qs=[0.6,0.5,0.4],out=null;
        for(var i=0;i<lados.length&&!out;i++){
          var k=Math.min(1,lados[i]/Math.max(img.width,img.height)),cv=document.createElement('canvas');
          cv.width=Math.max(1,Math.round(img.width*k));cv.height=Math.max(1,Math.round(img.height*k));
          cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
          for(var j=0;j<qs.length;j++){var d=cv.toDataURL('image/jpeg',qs[j]);if(d.length<=110000){out=d;break}}
        }
        out?res(out):rej(new Error('grande'));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

var emailDe=function(u){var b=EMAIL_BASE.split('@');return b[0]+'+'+String(u).trim().toLowerCase()+'@'+b[1]};
async function acessoSupa(c,u,pw,novo,ex){
  try{
    if(!novo){
      if(!ex||!ex.userId)return 'Acesso sem usuário vinculado. Remova o acesso e crie de novo.';
      var r0=await SB.rpc('admin_set_password',{p_user:ex.userId,p_password:pw});
      if(r0.error)throw r0.error;
    }else{
      var tmp=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'giromoto-tmp'}});
      var r=await tmp.auth.signUp({email:emailDe(u),password:pw});
      if(r.error){
        if(/registered|exists/i.test(r.error.message||''))return 'Esse usuário já existe no sistema.';
        if(/password/i.test(r.error.message||''))return 'Senha recusada: use pelo menos 6 caracteres.';
        if(/rate|too many|limit/i.test(r.error.message||''))return 'O Supabase limitou o envio de e-mails. Desligue "Confirm email" em Authentication > Sign In / Providers > Email e tente de novo.';
        return 'Não foi possível criar o login ('+(r.error.message||'erro')+').';
      }
      var uid=r.data&&r.data.user&&r.data.user.id;
      if(!uid)throw new Error('sem id');
      if(Array.isArray(r.data.user.identities)&&!r.data.user.identities.length)return 'Esse usuário já existe no sistema.';
      var rp=await SB.from('profiles').insert({user_id:uid,role:'cliente',cliente_id:c.id});
      if(rp.error)throw rp.error;
      if(!r.data.session){var rc=await SB.rpc('admin_set_password',{p_user:uid,p_password:pw});if(rc.error)throw rc.error}
      await store.set('acessos','a-'+c.id,{clienteId:c.id,usuario:u,userId:uid,ativo:true,criadoEm:today()});
    }
    setTimeout(function(){mostrarAcesso(c,u,pw)},0);
  }catch(e){return 'Não foi possível salvar o acesso ('+((e&&e.message)||'erro')+').'}
}
async function removerAcesso(cid){
  var a=await store.getDoc('acessos','a-'+cid);
  if(!a)return;
  if(SB&&a.userId){var r=await SB.rpc('admin_delete_user',{p_user:a.userId});if(r.error)throw r.error}
  await store.del('acessos','a-'+cid);
}

function resultadoMotos(){
  if(!S.motos.length)return '<p class="nota">Cadastre motos para ver o resultado.</p>';
  var locMoto={},rec={},cus={};
  S.locacoes.forEach(function(l){locMoto[l.id]=l.motoId});
  S.pagamentos.forEach(function(p){var m=locMoto[p.locacaoId];if(m)rec[m]=(rec[m]||0)+(+p.valor||0)});
  S.manutencoes.forEach(function(r){cus[r.motoId]=(cus[r.motoId]||0)+(+r.custo||0)});
  var L=S.motos.map(function(m){var r=r2(rec[m.id]||0),c=r2(cus[m.id]||0);return {m:m,r:r,c:c,res:r2(r-c)}}).sort(function(a,b){return b.res-a.res});

/* parcelas semanais com os pagamentos abatendo as mais antigas primeiro */
function parcelasDe(l){
  if(!l.valorSemanal)return [];
  var t=today(),ate=l.status==='ativa'?addDays(t,7):(l.encerradaEm||l.fim),resto=pago(l.id);
  var due=vencs(l,ate);
  if(l.status==='ativa'){var fut=due.filter(function(v){return v>t});if(fut.length>1)due=due.filter(function(v){return v<=t||v===fut[0]})}
  return due.map(function(v){
    var cob=Math.min(resto,l.valorSemanal);resto=r2(resto-cob);
    var aberto=r2(l.valorSemanal-cob),st,dias=diff(v,t);
    if(aberto<=0)st=['ok','Paga'];
    else if(v<t)st=['bad','Atrasada '+plural(dias,'dia','dias')];
    else if(v===t)st=['warn','Vence hoje'];
    else st=['info','A vencer'];
    return {data:v,valor:l.valorSemanal,aberto:aberto,pago:cob,st:st};
  });
}

var AUTH={salt:'5d0f7a3c9b1e4a62c8d4e1f0a7b39c25',iter:150000,hash:'ebfbcee2daa548289d4318b5e47cf2d14ff5de69bd62434bd2481ee004e2a22d'};
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,'0')}).join('')}
function unhex(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
async function derive(user,pass,saltHex,iter){
  var key=await crypto.subtle.importKey('raw',new TextEncoder().encode(user.trim().toLowerCase()+'\u0000'+pass),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unhex(saltHex),iterations:iter},key,256);
  return hex(bits);
}

  if(SB)try{SB.auth.signOut()}catch(x){}
  $('#shell').hidden=true;$('#login').hidden=false;
  $('#lu').value='';$('#lp').value='';$('#lerr').textContent='';$('#lu').focus();
}

async function perfilAtual(){
  var u=await SB.auth.getUser();
  var id=u&&u.data&&u.data.user&&u.data.user.id;
  if(!id)return null;
  var r=await SB.from('profiles').select('role,cliente_id').eq('user_id',id).maybeSingle();
  if(r.error||!r.data)return null;
  return r.data;
}
async function entrarComPerfil(){
  var p=await perfilAtual();
  if(!p)return false;
  if(p.role==='admin'){await unlock('admin');return true}
  if(p.role==='cliente'&&p.cliente_id){await unlock('cliente',{id:'a-'+p.cliente_id,clienteId:p.cliente_id});return true}
  return false;
}
async function loginSupa(u,pw){
  var r=await SB.auth.signInWithPassword({email:emailDe(u),password:pw});
  if(r.error){
    var m=String(r.error.message||''),st=r.error.status;
    if(/confirm/i.test(m))return 'Usuário ainda não confirmado no Supabase. Marque "Auto Confirm User" ao criá-lo.';
    if(/invalid login|invalid_credentials|invalid credentials/i.test(m)||st===400)return 'Usuário ou senha incorretos.';
    return 'Sem conexão com o servidor ('+(m||'erro')+').';
  }
  var ok=false;
  try{ok=await entrarComPerfil()}catch(e){ok=false}
  if(!ok){await SB.auth.signOut();return 'Este usuário não tem acesso ao sistema.'}
  return '';
}

function formSetup(){
  openSheet({
    title:'Criar administrador',
    submitLabel:'Criar e entrar',
    body:'<p class="nota">Primeiro acesso: crie o login do dono do sistema. Esta opção some assim que o administrador existir.</p>'+
      '<label>Usuário<input id="f-su" name="usuario" required autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30" value="admin"></label>'+
      '<label>Senha<input id="f-sp" name="senha" type="password" required minlength="8" autocomplete="new-password"></label>'+
      '<label>Repita a senha<input id="f-sp2" name="senha2" type="password" required minlength="8" autocomplete="new-password"></label>'+
      '<p class="nota">Use pelo menos 8 caracteres. Anote a senha: ela só pode ser trocada pelo painel do Supabase.</p>',
    onSubmit:function(fd){
      var u=(fd.usuario||'').trim().toLowerCase(),pw=fd.senha||'';
      if(u.indexOf('@')>-1)return 'Digite só um nome de usuário, como admin, e não um e-mail.';
      if(!/^[a-z0-9._-]{3,30}$/.test(u))return 'Usuário: use de 3 a 30 letras minúsculas, números, ponto, hífen ou sublinhado.';
      if(pw.length<8)return 'A senha precisa ter pelo menos 8 caracteres.';
      if(pw!==fd.senha2)return 'As duas senhas não são iguais.';
      return setupAdmin(u,pw);
    }
  });
}
async function setupAdmin(u,pw){
  try{
    var r=await SB.auth.signUp({email:emailDe(u),password:pw});
    var ja='Esse usuário já existe no Supabase. Apague-o em Authentication > Users e tente de novo.';
    if(r.error){
      var m=String(r.error.message||'');
      if(/registered|exists/i.test(m))return ja;
      if(/rate/i.test(m))return 'O Supabase limitou os envios por agora. Desligue "Confirm email" e tente de novo em alguns minutos.';
      return 'Não foi possível criar o administrador ('+m+').';
    }
    var user=r.data&&r.data.user;
    if(!user||!user.id||(Array.isArray(user.identities)&&!user.identities.length))return ja;
    var rp=await SB.rpc('criar_primeiro_admin',{p_user:user.id});
    if(rp.error){
      if(/existe administrador/i.test(rp.error.message||''))return 'Já existe um administrador. Entre com o login dele.';
      return 'Não foi possível definir o administrador ('+(rp.error.message||'erro')+'). Rode o schema.sql atualizado no Supabase.';
    }
    var li=await SB.auth.signInWithPassword({email:emailDe(u),password:pw});
    if(li.error)return 'Administrador criado, mas o login falhou ('+li.error.message+'). Tente entrar pela tela inicial.';
    $('#lsetup').hidden=true;
    setTimeout(function(){entrarComPerfil().catch(function(){})},0);
    return '';
  }catch(e){return 'Falha de conexão com o servidor. Tente de novo.'}
}
$('#lsetup').addEventListener('click',formSetup);
var fails=0;
$('#lf').addEventListener('submit',async function(e){
  e.preventDefault();
  var btn=$('#lgo'),err=$('#lerr'),u=$('#lu').value,p=$('#lp').value;
  err.textContent='';
  if(!u.trim()||!p){err.textContent='Informe o usuário e a senha.';return}
  if(!(window.crypto&&window.crypto.subtle)){err.textContent='Este navegador não permite verificar a senha com segurança.';return}
  btn.disabled=true;
  try{
    if(SB){
      var em=await loginSupa(u,p);
      if(em){fails++;await new Promise(function(r){setTimeout(r,Math.min(4000,500*fails))});err.textContent=em;$('#lp').value='';$('#lp').focus()}
      else{fails=0;$('#lp').value=''}
      btn.disabled=false;return;
    }
    var h=await derive(u,p,AUTH.salt,AUTH.iter);
    if(h===AUTH.hash){fails=0;setSess('admin');$('#lp').value='';await unlock('admin')}
    else{
      var a=await tryCliente(u,p);
      if(a){fails=0;setSess('c:'+a.id);$('#lp').value='';await unlock('cliente',a)}
      else{fails++;await new Promise(function(r){setTimeout(r,Math.min(4000,500*fails))});err.textContent='Usuário ou senha incorretos.';$('#lp').value='';$('#lp').focus()}
    }
  }catch(x){err.textContent='Não foi possível verificar agora. Tente de novo.'}
  btn.disabled=false;
});
$('#lshow').addEventListener('click',function(){var i=$('#lp'),s=i.type==='password';i.type=s?'text':'password';this.textContent=s?'Ocultar':'Mostrar'});

if(SUPABASE_URL&&!window.supabase){$('#lerr').textContent='Não foi possível carregar o sistema. Verifique a internet e recarregue a página.';$('#lgo').disabled=true}
if(SB){
  SB.rpc('precisa_setup').then(function(r){if(r&&r.data===true)$('#lsetup').hidden=false}).catch(function(){});
  SB.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT'&&S.mode)lock()});
  SB.auth.getSession().then(function(r){
    if(r&&r.data&&r.data.session)return entrarComPerfil().then(function(ok){if(!ok){SB.auth.signOut();$('#lu').focus()}});
    $('#lu').focus();
  }).catch(function(){$('#lu').focus()});
}
/* sem banco disponível o app abre em demonstração, com um cliente de teste */
if(!SB&&!SUPABASE_URL)getStore().then(function(){if(S.demo){var h=$('#lhint');h.textContent='Demonstração sem dados reais. Administrador: demo / demo1234. Cliente: rafael.moreira / demo1234';h.hidden=false}}).catch(function(){});
var sess=null;try{sess=sessionStorage.getItem('garagem-auth')}catch(x){}
if(SB){}
else if(sess==='admin'||sess==='1')unlock('admin');
else if(sess&&sess.indexOf('c:')===0){
  getStore().then(function(st){return st.getDoc('acessos',sess.slice(2))}).then(function(a){
    if(a&&a.ativo!==false)unlock('cliente',a);else{clearSess();$('#lu').focus()}
  }).catch(function(){$('#lu').focus()});
}else $('#lu').focus();
})();
</script>
